<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <title>Document</title>
  </head>
  <body>
    <section
      class="relative bg-gradient-to-b from-purple-700 to-purple-900 min-h-screen flex items-center"
    >
      <!-- Container -->
      <div class="container mx-auto px-6 text-center md:text-left">
        <!-- Heading -->
        <h1 class="text-white text-5xl md:text-6xl font-bold leading-tight">
          Your <span class="text-purple-300">AI</span> Ghostwriter
        </h1>

        <!-- Subtext -->
        <p class="text-white/70 mt-4 text-lg md:text-xl">
          Stop spending hours writing posts. Our AI learns your voice and
          generates high-converting content instantly.
        </p>

        <!-- Buttons -->
        <div
          class="mt-8 flex flex-col md:flex-row justify-center md:justify-start gap-4"
        >
          <button
            class="bg-purple-500 hover:bg-purple-600 text-white font-semibold px-6 py-3 rounded-full"
          >
            Start Free Trial
          </button>
          <button
            class="border border-purple-300 text-white hover:bg-white/10 px-6 py-3 rounded-full font-semibold"
          >
            Learn How It Works
          </button>
        </div>
      </div>

      <!-- Optional hero image -->
      <img
        src="./images/hero-image.svg"
        alt="Hero"
        class="hidden md:block absolute right-0 bottom-0 h-96"
      />
    </section>
  </body>
</html>
